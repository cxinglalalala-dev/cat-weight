<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宠物减肥记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="cat-switcher" class="cat-switcher" data-action="toggle-cat-menu">
        <span class="cat-emoji">🐱</span>
        <span id="cat-name"></span>
        <span class="chevron">▾</span>
      </button>
      <div class="topbar-actions">
        <button id="gear-btn" class="icon-btn" data-action="gear" title="设置">⚙️</button>
        <button id="back-btn" class="icon-btn hidden" data-action="back" title="返回">←</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav">
      <button class="nav-item" data-action="nav" data-page="home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-item" data-action="nav" data-page="feeding">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        <span>进食记录</span>
      </button>
      <button class="nav-item" data-action="nav" data-page="weight">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>体重趋势</span>
      </button>
    </nav>
  </div>

  <div id="cat-menu" class="cat-menu hidden"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="storage.js"></script>
  <script src="calorie.js"></script>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
